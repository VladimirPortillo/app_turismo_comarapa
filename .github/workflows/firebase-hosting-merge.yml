# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. Instala Flutter en el servidor de GitHub
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      # 2. Descarga las dependencias de tu proyecto
      - run: flutter pub get
      
      # 3. Compila el proyecto para la web
      - run: flutter build web
      
      # 4. Despliega en Firebase Hosting
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COMARAPA_TURISMO }}
          channelId: live
          projectId: comarapa-turismo