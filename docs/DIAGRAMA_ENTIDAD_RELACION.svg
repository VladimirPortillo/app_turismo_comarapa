<text x="610" y="803" font-size="11.3" fill="#333333">entidad  entidad_resenable  ('lugar'|'hotel'|'restaurante'|'actividad'|'evento'|'gastronomia')</text>
<text x="610" y="819" font-size="11.3" fill="#333333">entidad_id  uuid   (SIN FK real - referencia polimorfica)</text>
<text x="610" y="835" font-size="11.3" fill="#333333">autor_nombre, calificacion (1-5), comentario</text>
<text x="610" y="851" font-size="11.3" fill="#333333">estado_moderacion  ('pendiente' | 'aprobada' | 'rechazada')</text>
<text x="610" y="870" font-size="10.6" fill="#777777" font-style="italic">created_at</text>
<text x="610" y="888" font-size="10.3" fill="#7A2E3B" font-style="italic">integridad de "entidad_id" validada por la app, no por FK de BD</text>

